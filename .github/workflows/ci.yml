name: CI
on:
  push:
  pull_request:
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: assets/data.js matches the CSV files
        run: npm run check:data
